name: Build APK Açaí da 7

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Gerar 50 toques de pedidos
        run: python3 tools/generate_notification_sounds.py

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar APK
        working-directory: ACAI_DA_7_PAINEL_ANDROID_FCM_PROJETO/AcaiDa7PainelApp
        run: gradle --no-daemon assembleDebug -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Preparar APK para atualização
        run: cp ACAI_DA_7_PAINEL_ANDROID_FCM_PROJETO/AcaiDa7PainelApp/app/build/outputs/apk/debug/app-debug.apk AcaiDa7-Painel-APK.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: AcaiDa7-Painel-APK
          path: AcaiDa7-Painel-APK.apk
          if-no-files-found: error

      - name: Atualizar release estável
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest \
              --target "$GITHUB_SHA" \
              --title "Açaí da 7 — Atualização" \
              --notes "VERSION_NAME=$VERSION_NAME"
          else
            gh release edit latest \
              --title "Açaí da 7 — Atualização" \
              --notes "VERSION_NAME=$VERSION_NAME"
          fi
          gh release upload latest AcaiDa7-Painel-APK.apk --clobber
