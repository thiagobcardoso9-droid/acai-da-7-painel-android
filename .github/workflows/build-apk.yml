name: Build APK Açaí da 7

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Gerar 50 toques de pedidos
        run: python3 tools/generate_notification_sounds.py

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Preparar assinatura permanente
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "KEYSTORE_BASE64 não configurado" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/signing-key.jks"
          chmod 600 "$GITHUB_WORKSPACE/signing-key.jks"

      - name: Compilar APK Release assinado
        working-directory: ACAI_DA_7_PAINEL_ANDROID_FCM_PROJETO/AcaiDa7PainelApp
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/signing-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || (echo "KEYSTORE_PASSWORD não configurado" && exit 1)
          test -n "$KEY_ALIAS" || (echo "KEY_ALIAS não configurado" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "KEY_PASSWORD não configurado" && exit 1)
          gradle --no-daemon assembleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Preparar APK para atualização
        run: cp ACAI_DA_7_PAINEL_ANDROID_FCM_PROJETO/AcaiDa7PainelApp/app/build/outputs/apk/release/app-release.apk AcaiDa7-Painel-APK.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: AcaiDa7-Painel-APK
          path: AcaiDa7-Painel-APK.apk
          if-no-files-found: error

      - name: Atualizar release estável
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest \
              --target "$GITHUB_SHA" \
              --title "Açaí da 7 — Atualização" \
              --notes "VERSION_NAME=$VERSION_NAME"
          else
            gh release edit latest \
              --title "Açaí da 7 — Atualização" \
              --notes "VERSION_NAME=$VERSION_NAME"
          fi
          gh release upload latest AcaiDa7-Painel-APK.apk --clobber

      - name: Remover chave de assinatura do runner
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/signing-key.jks"
